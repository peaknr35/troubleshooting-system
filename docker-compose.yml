# Local full stack: FastAPI backend (8080) + Next.js frontend (3000).
# Run:  docker compose up --build
# The browser talks to the backend at http://localhost:8080 directly, so the
# frontend is built with that as NEXT_PUBLIC_BACKEND_URL.

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_LOG_LEVEL: INFO
      APP_CORS_ORIGINS: "http://localhost:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
    ports:
      - "3000:3000"
    depends_on:
      - backend
