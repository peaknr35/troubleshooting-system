[project]
name = "deep-research-backend"
version = "0.2.0"
description = "Local-first personal agent + streaming deep research (OpenAI, Anthropic, Kimi K2)"
requires-python = ">=3.11"

[project.scripts]
assistant = "app.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
