[project]
name = "deep-research-backend"
version = "0.1.0"
description = "Streaming deep-research FastAPI backend (OpenAI, Anthropic, Kimi K2)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
